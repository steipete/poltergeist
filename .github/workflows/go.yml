name: Go example

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/go-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/go-cli/go.mod
          cache-dependency-path: examples/go-cli/go.mod
      - run: go build ./...
      - run: go test ./...
      - run: test "$(go run ./cmd/greeter)" = 'Hello from Go!'
