name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify all artifacts without publishing; false publishes the verified draft npm tarball
        type: boolean
        required: true
        default: true
      version:
        description: Current package version (non-dry runs require the matching v tag)
        type: string
        required: true
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-npm:
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    name: Publish verified npm tarball
    runs-on: ubuntu-latest
    permissions:
      # GitHub requires writer access to read draft release assets.
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Validate tag and download verified draft tarball
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/v$VERSION^{commit}")"
          node -e 'if (require("./package.json").version !== process.env.VERSION) throw new Error("Version mismatch")'
          gh release view "v$VERSION" --json isDraft --jq '.isDraft' | grep -qx true
          mkdir npm-release
          gh release download "v$VERSION" --pattern "steipete-poltergeist-$VERSION.tgz" --dir npm-release
          tar -xzf "npm-release/steipete-poltergeist-$VERSION.tgz" -C npm-release
          node -e 'const p = require("./npm-release/package/package.json"); if (p.name !== "@steipete/poltergeist" || p.version !== process.env.VERSION) throw new Error("Unexpected npm package")'

      - name: Check whether the original tarball is already published
        id: npm-state
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          expected="sha512-$(openssl dgst -sha512 -binary "npm-release/steipete-poltergeist-$VERSION.tgz" | openssl base64 -A)"
          actual="$(npm view "@steipete/poltergeist@$VERSION" dist.integrity 2>/dev/null || true)"
          if [[ -n "$actual" ]]; then
            test "$actual" = "$expected"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish original tarball with trusted publishing
        if: steps.npm-state.outputs.published != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: npm publish "./npm-release/steipete-poltergeist-$VERSION.tgz" --provenance --access public --ignore-scripts

      - name: Verify published bytes
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          expected="sha512-$(openssl dgst -sha512 -binary "npm-release/steipete-poltergeist-$VERSION.tgz" | openssl base64 -A)"
          for attempt in {1..30}; do
            actual="$(npm view "@steipete/poltergeist@$VERSION" dist.integrity 2>/dev/null || true)"
            if [[ "$actual" = "$expected" ]]; then
              exit 0
            fi
            if [[ -n "$actual" ]]; then
              echo "Published tarball integrity does not match the release asset" >&2
              exit 1
            fi
            echo "Waiting for npm to finish processing the package ($attempt/30)"
            sleep 10
          done
          echo "The published package is not yet visible in the registry" >&2
          exit 1

  build-cli:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    name: Build CLI Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POLTERGEIST_TEST_MODE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate dry-run version
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node -e 'const actual = require("./package.json").version; if (process.env.EXPECTED_VERSION !== actual) throw new Error("Expected current package version " + actual);'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI project
        run: pnpm run build

      - name: Run tests
        run: pnpm vitest --config vitest.config.ci.ts

      - name: Run linter
        run: pnpm run lint

      - name: Run type check
        run: pnpm run typecheck

      - name: Test release guards
        run: node --test scripts/test-release.mjs

      - name: Package for npm
        run: pnpm pack

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: poltergeist-cli
          path: "*.tgz"

  build-macos:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    name: Build macOS App Release
    runs-on: xcode-27
    env:
      POLTERGEIST_TEST_MODE: "true"
      POLTERGEIST_CODESIGN_IDENTITY: "Developer ID Application: Peter Steinberger (Y5PE65HELJ)"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show image Xcode version
        run: xcodebuild -version

      - name: Install SwiftLint and swift-format
        run: |
          brew install swiftlint swift-format

      - name: Run SwiftLint
        run: |
          cd apps/mac
          ./scripts/lint.sh

      - name: Import personal Developer ID certificate
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          bash scripts/import-signing-certificate.sh

      - name: Build and sign macOS app (Release)
        env:
          POLTERGEIST_VERSION: ${{ inputs.version || github.ref_name }}
          POLTERGEIST_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export POLTERGEIST_VERSION="${POLTERGEIST_VERSION#v}"
          apps/mac/scripts/build-release.sh

      - name: Notarize and staple macOS app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          apps/mac/scripts/notarize-release.sh \
            apps/mac/build/Build/Products/Release/Poltergeist.app

      - name: Verify Developer ID signature and Gatekeeper acceptance
        run: |
          apps/mac/scripts/verify-release.sh \
            apps/mac/build/Build/Products/Release/Poltergeist.app

      - name: Package macOS app
        run: |
          cd apps/mac
          APP_PATH="build/Build/Products/Release/Poltergeist.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found at $APP_PATH"
            exit 1
          fi
          ARCHIVE_NAME="Poltergeist-${{ inputs.version || github.ref_name }}-macOS.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ARCHIVE_NAME"

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${POLTERGEIST_CI_KEYCHAIN:-}" ]]; then
            security delete-keychain "$POLTERGEIST_CI_KEYCHAIN" || true
          fi

      - name: Upload macOS app artifacts
        uses: actions/upload-artifact@v7
        with:
          name: poltergeist-macos
          path: |
            apps/mac/*.zip

  build-homebrew:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    name: Build Homebrew CLI Asset
    runs-on: xcode-27
    env:
      POLTERGEIST_TEST_MODE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm run build

      - name: Import personal Developer ID certificate
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: bash scripts/import-signing-certificate.sh

      - name: Package universal Homebrew binaries
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          POLTERGEIST_CODESIGN_IDENTITY: "Developer ID Application: Peter Steinberger (Y5PE65HELJ)"
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          mkdir -p dist-homebrew

          bun build src/cli.ts --compile --target=bun-darwin-arm64 --outfile dist-homebrew/poltergeist-arm64 --minify
          bun build src/cli.ts --compile --target=bun-darwin-x64 --outfile dist-homebrew/poltergeist-x64 --minify
          bun build scripts/polter-bun.ts --compile --target=bun-darwin-arm64 --outfile dist-homebrew/polter-arm64 --minify
          bun build scripts/polter-bun.ts --compile --target=bun-darwin-x64 --outfile dist-homebrew/polter-x64 --minify

          scripts/package-macos-universal.sh dist-homebrew "$version"

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${POLTERGEIST_CI_KEYCHAIN:-}" ]]; then
            security delete-keychain "$POLTERGEIST_CI_KEYCHAIN" || true
          fi

      - name: Upload Homebrew artifact
        uses: actions/upload-artifact@v7
        with:
          name: poltergeist-homebrew
          path: |
            poltergeist-macos-universal-*.tar.gz
            poltergeist-macos-universal-*.sha256
            poltergeist-macos-universal-*.notary.json

  release:
    if: github.event_name == 'push'
    name: Create GitHub Release
    needs: [build-cli, build-macos, build-homebrew]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          name: poltergeist-cli
          path: ./cli/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: poltergeist-macos
          path: ./macos/

      - name: Download Homebrew artifacts
        uses: actions/download-artifact@v8
        with:
          name: poltergeist-homebrew
          path: ./homebrew/

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: poltergeist ${{ steps.release-version.outputs.version }}
          files: |
            cli/*.tgz
            macos/*.zip
            homebrew/*.tar.gz
            homebrew/*.sha256
            homebrew/*.notary.json
          draft: true
          body_path: release-notes.md

  update-homebrew-tap:
    name: Update Homebrew Tap
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ -z "$tag" ]]; then
            echo "Missing release tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "request_id=poltergeist-${tag}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Dispatch tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh workflow run update-formula.yml \
            --repo steipete/homebrew-tap \
            -f formula=poltergeist \
            -f tag="${{ steps.release.outputs.tag }}" \
            -f repository=steipete/poltergeist \
            -f macos_artifact="poltergeist-macos-universal-${{ steps.release.outputs.tag }}.tar.gz" \
            -f request_id="${{ steps.release.outputs.request_id }}"

      - name: Wait for tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..20}; do
            run_id="$(gh run list --repo steipete/homebrew-tap --workflow update-formula.yml --json databaseId,displayTitle --jq '.[] | select(.displayTitle | contains("${{ steps.release.outputs.request_id }}")) | .databaseId' | head -n1)"
            if [[ -n "$run_id" ]]; then
              gh run watch "$run_id" --repo steipete/homebrew-tap --exit-status
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for tap workflow to appear." >&2
          exit 1
